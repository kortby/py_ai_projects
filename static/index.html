<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Feedback</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-100 p-6 sm:p-8 space-y-6">
        <!-- Header -->
        <div class="text-center space-y-2">
            <div
                class="inline-flex items-center justify-center w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full mb-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">Thanks for shopping with us!</h1>
            <p class="text-sm text-slate-500">Let us know how your experience was below.</p>
        </div>

        <!-- Input Section -->
        <div class="space-y-4">
            <div>
                <label for="review" class="block text-sm font-medium text-slate-700 mb-1.5">
                    Your Review
                </label>
                <textarea id="review" rows="3"
                    placeholder="e.g., The delivery was super fast and I loved the packaging!"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-sm resize-none"></textarea>
            </div>

            <button id="submitBtn" onclick="submitReview()"
                class="w-full inline-flex items-center justify-center px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium text-sm rounded-xl transition duration-150 shadow-sm shadow-indigo-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed">
                <span>Submit Review</span>
            </button>
        </div>

        <!-- Result / Output Area -->
        <div id="resultBox" class="hidden rounded-xl p-4 bg-slate-50 border border-slate-100 text-center">
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Response</p>
            <p id="deal" class="text-sm font-medium text-slate-800 leading-relaxed"></p>
        </div>
    </div>

    <script>
        function submitReview() {
            const reviewInput = document.getElementById("review");
            const submitBtn = document.getElementById("submitBtn");
            const dealEl = document.getElementById("deal");
            const resultBox = document.getElementById("resultBox");
            const reviewText = reviewInput.value.trim();

            if (!reviewText) {
                reviewInput.focus();
                return;
            }

            // Show loading feedback
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        Analyzing...
      `;

            fetch(`/api/gpt?review=${encodeURIComponent(reviewText)}`)
                .then((response) => response.json())
                .then((data) => {
                    resultBox.classList.remove("hidden");
                    dealEl.textContent = data;
                })
                .catch((err) => {
                    console.error("Fetch Error:", err);
                    resultBox.classList.remove("hidden");
                    dealEl.textContent = "Something went wrong. Please try again.";
                    dealEl.classList.add("text-rose-600");
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Submit Review";
                });
        }
    </script>
</body>

</html>
