<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-100 p-6 sm:p-8 space-y-6">
        <div class="text-center space-y-2">
            <div
                class="inline-flex items-center justify-center w-12 h-12 bg-amber-50 text-amber-600 rounded-full mb-1 text-2xl">
                🍕
            </div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">Customer Review & Chat</h1>
            <p class="text-sm text-slate-500">Ask about pizza or share your feedback.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label for="review" class="block text-sm font-medium text-slate-700 mb-1.5">
                    Your Message
                </label>
                <textarea id="review" rows="3" placeholder="e.g., The margherita crust was fantastic!"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition text-sm resize-none"></textarea>
            </div>

            <button id="submitBtn" onclick="submitReview()"
                class="w-full inline-flex items-center justify-center px-4 py-2.5 bg-amber-600 hover:bg-amber-700 active:bg-amber-800 text-white font-medium text-sm rounded-xl transition duration-150 shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500 disabled:opacity-50">
                <span>Send Message</span>
            </button>
        </div>

        <div id="resultBox" class="hidden rounded-xl p-4 bg-slate-50 border border-slate-100 text-center">
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Response</p>
            <p id="deal" class="text-sm font-medium text-slate-800 leading-relaxed"></p>
        </div>
    </div>

    <script>
        async function submitReview() {
            const inputEl = document.getElementById("review");
            const submitBtn = document.getElementById("submitBtn");
            const dealEl = document.getElementById("deal");
            const resultBox = document.getElementById("resultBox");
            const text = inputEl.value.trim();

            if (!text) {
                inputEl.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Analyzing...";

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }

                const data = await response.json();
                resultBox.classList.remove("hidden");
                dealEl.classList.remove("text-rose-600");
                dealEl.textContent = data.reply;
            } catch (err) {
                resultBox.classList.remove("hidden");
                dealEl.classList.add("text-rose-600");
                dealEl.textContent = "Something went wrong. Please check your connection.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Send Message";
            }
        }
    </script>
</body>

</html>
